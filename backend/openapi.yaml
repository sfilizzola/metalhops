  /v1/moderation/reviews/{reviewID}/actions:
    post:
      operationId: applyReviewAction
      summary: Remove commentary or delete a review
      description: Requires Idempotency-Key. A write that appends an audit row is 201. A remove_commentary no-op is 200 with action_id null and is not stored. The stored idempotency body never contains a commentary key.
      security:
        - bearerAuth: []
      parameters:
        - name: reviewID
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        - name: Idempotency-Key
          in: header
          required: true
          description: 8 to 128 printable ASCII characters. The idempotency operation is review_moderation_action.
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewModerationAction"
            examples:
              remove:
                value:
                  action: remove_commentary
                  reason: spam
              delete:
                value:
                  action: delete_review
                  reason: other
                  note: Illegal content.
      responses:
        "200":
          description: remove_commentary was a no-op. action_id is null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewActionResponse"
        "201":
          description: The moderation action was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewActionResponse"
        "400":
          description: The body, Review id, or idempotency key is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller has no platform operator row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: forbidden
                  message: This action requires a moderator account.
                  request_id: abc
        "404":
          description: No Review has that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: review_not_found
                  message: Review not found.
                  request_id: abc
        "409":
          description: remove_commentary was refused because there is no public commentary and no restriction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: commentary_not_public
                  message: This review has no public commentary.
                  request_id: abc
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/AuthProvider"
