  responses:
    Unauthorized:
      description: The bearer token or live session was rejected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthorized
              message: Authentication is required.
              request_id: abc
    RateLimited:
      description: The public or per-user write limit refused the request.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: rate_limited
              message: Too many requests.
              request_id: abc
    Internal:
      description: Live-session storage or another internal dependency failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal_error
              message: The server could not complete the request.
              request_id: abc
    AuthProvider:
      description: A required JWKS refresh is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: auth_provider_error
              message: The authentication provider is unavailable.
              request_id: abc
    BodyTooLarge:
      description: The JSON body is larger than 64 KiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMedia:
      description: Content-Type is not application/json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReviewConflict:
      description: The Venue is pending, the caller has no profile, or commentary is locked for this User and Venue.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            not_verified:
              value:
                error:
                  code: venue_not_verified
                  message: Reviews open after this venue is verified.
                  request_id: abc
            profile:
              value:
                error:
                  code: profile_required
                  message: Create a profile first.
                  request_id: abc
            commentary_locked:
              value:
                error:
                  code: commentary_locked
                  message: Commentary on this review is locked.
                  request_id: abc
                  details:
                    commentary_restriction:
                      reason: spam
                      note: keep it down
                      created_at: "2026-10-21T10:00:00Z"
    ContributionForbidden:
      description: The caller is a platform moderator, or, on a write, the caller's profile cannot contribute.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            forbidden:
              value:
                error:
                  code: forbidden
                  message: This action is unavailable for this account.
                  request_id: abc
            rename:
              value:
                error:
                  code: profile_rename_required
                  message: Rename this profile before continuing.
                  request_id: abc
            suspended:
              value:
                error:
                  code: profile_suspended
                  message: This profile is suspended.
                  request_id: abc
                  details:
                    suspended_until: "2026-10-16T12:00:00Z"
