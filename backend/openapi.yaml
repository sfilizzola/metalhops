      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties:
                confirmation:
                  const: DELETE MY ACCOUNT
            example:
              confirmation: DELETE MY ACCOUNT
      responses:
        "204":
          description: The account was deleted.
        "400":
          description: The confirmation did not match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is a platform moderator, or the live session is older than ten minutes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                forbidden:
                  value:
                    error:
                      code: forbidden
                      message: This action is unavailable for this account.
                      request_id: abc
                recent:
                  value:
                    error:
                      code: recent_authentication_required
                      message: Sign in again to delete your account.
                      request_id: abc
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
