          description: The caller is a platform moderator, or a suspended profile cannot change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                forbidden:
                  value:
                    error:
                      code: forbidden
                      message: This action is unavailable for this account.
                      request_id: abc
