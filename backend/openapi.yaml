openapi: 3.1.0
info:
  title: MetalHops API
  version: 0.1.0
  description: Routes the running API implements.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Process health
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    const: ok
              example:
                status: ok
  /readyz:
    get:
      operationId: getReady
      summary: Dependency readiness
      responses:
        "200":
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    const: ok
              example:
                status: ok
        "503":
          description: A required dependency is not ready.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, reason]
                properties:
                  status:
                    const: not_ready
                  reason:
                    enum:
                      - database_unreachable
                      - migrations_unavailable
                      - migrations_behind
              example:
                status: not_ready
                reason: migrations_unavailable
  /v1/genres:
    get:
      operationId: listGenres
      summary: List genres
      responses:
        "200":
          description: Every genre, ordered deterministically by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreListResponse"
              example:
                data:
                  - id: 1
                    name: Black metal
        "400":
          description: The query has a parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: validation_error
                  message: The request is invalid.
                  request_id: abc
                  fields:
                    limit: is not accepted
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /v1/venues:
    get:
      operationId: listVenues
      summary: List the public venue catalogue
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque next_cursor from a previous page. Valid only with the same filters that produced it; limit may change. Otherwise the request fails with cursor invalid.
          schema:
            type: string
        - name: query
          in: query
          required: false
          description: Substring match on Venue name, address, or city. Matching ignores case, accents, punctuation, and whitespace, and does not tolerate typos. Must contain a letter or digit.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: genre_id
          in: query
          required: false
          description: Repeat to match Venues with any of the listed Genres. Unknown ids match nothing.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              type: integer
              minimum: 1
              maximum: 2147483647
        - name: city
          in: query
          required: false
          description: Exact city match after the same folding as query, so Saint-Étienne matches Saint Etienne. Must contain a letter or digit.
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: country_code
          in: query
          required: false
          description: Official ISO 3166-1 alpha-2 code, plus XK for Kosovo. The United Kingdom is GB; UK is rejected.
          schema:
            type: string
            pattern: "^[A-Z]{2}$"
        - name: venue_type
          in: query
          required: false
          schema:
            type: string
            enum: [bar, pub, club]
        - name: latitude
          in: query
          required: false
          description: WGS84 latitude. Send with longitude and radius_km.
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          required: false
          description: WGS84 longitude. Send with latitude and radius_km.
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: radius_km
          in: query
          required: false
          description: Inclusive radius around latitude and longitude. Send with both.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: >-
            One page of public venues. Without query or location, results sort by
            folded name, then id. With a location only, by distance, then id. With
            query only, by relevance tier (exact name, name prefix, name substring,
            exact city, other city or address match), then folded name, then id.
            With query and a location, by relevance tier, then distance, then id.
            Traversal is stable while catalogue membership and sort keys are
            unchanged, and best-effort across concurrent changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueListResponse"
              example:
                data:
                  - id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    name: Alpha
                    description: A metal bar
                    latitude: 59.91
                    longitude: 10.75
                    address: 1 Metal Street
                    city: Oslo
                    country_code: DE
                    venue_type: bar
                    verification_status: pending
                    genres:
                      - id: 1
                        name: Classic rock
                    average_rating: null
                    review_count: 0
                    check_in_count: 0
                meta:
                  next_cursor: null
        "400":
          description: A filter, limit, or cursor is invalid, a parameter is repeated or unknown, or the location group is incomplete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: validation_error
                  message: The request is invalid.
                  request_id: abc
                  fields:
                    radius_km: must be provided with latitude, longitude, and radius_km
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createVenueSubmission
      summary: Submit a venue
      description: Creates a pending Venue whose Submitter is the caller. A pending Venue is in the public catalogue as not verified. Duplicate detection compares the normalized name, which folds case and accents, removes punctuation, and keeps single spaces, within 100 metres of a pending or verified Venue. A caller may create 10 Venue Submissions in a rolling 24 hours; corrections do not count.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 8 to 128 printable ASCII characters. The idempotency operation is venue_submission. A replay returns the stored 201 body and takes no quota slot.
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionRequest"
            example:
              name: Iron Maiden Pub
              latitude: 59.91
              longitude: 10.75
              address: 1 Metal Street
              city: Oslo
              country_code: "NO"
              venue_type: pub
              genre_ids: [1, 4]
      responses:
        "201":
          description: The pending Venue was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          description: The body or idempotency key is invalid, or a Genre id does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                field:
                  value:
                    error:
                      code: validation_error
                      message: The request is invalid.
                      request_id: abc
                      fields:
                        genre_ids: must be an existing genre
                key:
                  value:
                    error:
                      code: validation_error
                      message: The request is invalid.
                      request_id: abc
                      fields:
                        idempotency_key: required
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ContributionForbidden"
        "409":
          description: The caller has no profile, a strong duplicate exists, or the idempotency key was reused for a different command. Duplicate details appear only when the nearest disclosable match is verified or belongs to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                duplicate:
                  value:
                    error:
                      code: duplicate_venue
                      message: A matching venue already exists.
                      request_id: abc
                      details:
                        venue_id: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                        verification_status: verified
                duplicate_private:
                  value:
                    error:
                      code: duplicate_venue
                      message: A matching venue already exists.
                      request_id: abc
                profile:
                  value:
                    error:
                      code: profile_required
                      message: Create a profile first.
                      request_id: abc
                idempotency:
                  value:
                    error:
                      code: idempotency_key_reused
                      message: That idempotency key was already used.
                      request_id: abc
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          description: The submission quota or a write limit refused the request.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                quota:
                  value:
                    error:
                      code: quota_exceeded
                      message: The submission limit has been reached.
                      request_id: abc
                rate:
                  value:
                    error:
                      code: rate_limited
                      message: Too many requests.
                      request_id: abc
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/AuthProvider"
  /v1/venues/{venueID}:
    get:
      operationId: getVenue
      summary: Read one public venue
      parameters:
        - name: venueID
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      responses:
        "200":
          description: The public venue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueResponse"
              example:
                data:
                  id: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                  name: Iron Maiden Pub
                  description: null
                  latitude: 59.91
                  longitude: 10.75
                  address: 1 Metal Street
                  city: Oslo
                  country_code: "NO"
                  venue_type: pub
                  verification_status: verified
                  genres:
                    - id: 1
                      name: Classic rock
                  average_rating: 4.3
                  review_count: 3
                  check_in_count: 12
        "400":
          description: The id is not a canonical UUID, or a query parameter was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: validation_error
                  message: The request is invalid.
                  request_id: abc
                  fields:
                    venue_id: must be a canonical uuid
        "404":
          description: The venue is not in the public catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: venue_not_found
                  message: Venue not found.
                  request_id: abc
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /v1/venues/{venueID}/reviews:
    get:
      operationId: listVenueReviews
      summary: List a public venue's reviews
      description: Ordered by created_at descending, then id descending. Editing a Review does not move it. A pending Venue returns an empty page. An author who must rename or is suspended appears as MetalHops User with a null username, for every viewer.
      parameters:
        - name: venueID
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque next_cursor from a previous page of this Venue's reviews. A cursor from another Venue fails with cursor invalid.
          schema:
            type: string
      responses:
        "200":
          description: One page of Reviews.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"
              example:
                data:
                  - id: dddddddd-dddd-4ddd-8ddd-dddddddddddd
                    rating: 4
                    commentary: loud and cold
                    author:
                      username: metal_fan
                      display_name: Metal Fan
                    created_at: "2026-10-21T09:00:00Z"
                    updated_at: "2026-10-21T09:00:00Z"
                meta:
                  next_cursor: null
        "400":
          description: The id is not a canonical UUID, the limit or cursor is invalid, or a parameter is repeated or unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: validation_error
                  message: The request is invalid.
                  request_id: abc
                  fields:
                    cursor: invalid
        "404":
          description: The Venue is not in the public catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: venue_not_found
                  message: Venue not found.
                  request_id: abc
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /v1/venues/{venueID}/reviews/me:
    parameters:
      - name: venueID
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    get:
      operationId: getMyReview
      summary: Read the caller's review of a venue
      description: Shows the stored Username and display name. A caller who must rename or is suspended can read it.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's Review on a verified Venue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnReviewResponse"
        "400":
          description: The id is not a canonical UUID, or a query parameter was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ContributionForbidden"
        "404":
          description: The caller has no Review on this Venue, the Venue is pending, or it is not in the public catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: review_not_found
                  message: Review not found.
                  request_id: abc
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/AuthProvider"
    put:
      operationId: putMyReview
      summary: Set the caller's review of a verified venue
      description: Replaces the caller's whole Review. It does not take an Idempotency-Key. An unchanged rating and normalized commentary returns 200 with the stored Review, leaves updated_at unchanged, and spends no write token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
            example:
              rating: 4
              commentary: loud and cold
      responses:
        "200":
          description: The Review was replaced or was already equal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnReviewResponse"
        "201":
          description: The Review was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnReviewResponse"
              example:
                data:
                  id: dddddddd-dddd-4ddd-8ddd-dddddddddddd
                  user_id: eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee
                  rating: 4
                  commentary: loud and cold
                  author:
                    username: metal_fan
                    display_name: Metal Fan
                  created_at: "2026-10-21T09:00:00Z"
                  updated_at: "2026-10-21T09:00:00Z"
        "400":
          description: The id or body is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: validation_error
                  message: The request is invalid.
                  request_id: abc
                  fields:
                    rating: must be between 1 and 5
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ContributionForbidden"
        "404":
          description: The Venue is not in the public catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: venue_not_found
                  message: Venue not found.
                  request_id: abc
        "409":
          $ref: "#/components/responses/ReviewConflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/AuthProvider"
    delete:
      operationId: deleteMyReview
      summary: Delete the caller's review of a verified venue
      description: Reads no body. It does not take an Idempotency-Key.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The Review was deleted.
        "400":
          description: The id is not a canonical UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ContributionForbidden"
        "404":
          description: The Venue is not in the public catalogue, or the caller has no Review on this verified Venue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                venue:
                  value:
                    error:
                      code: venue_not_found
                      message: Venue not found.
                      request_id: abc
                review:
                  value:
                    error:
                      code: review_not_found
                      message: Review not found.
                      request_id: abc
        "409":
          $ref: "#/components/responses/ReviewConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/AuthProvider"
  /v1/venues/{venueID}/reviews/{reviewID}/reports:
    post:
      operationId: reportReview
      summary: Report a review's public commentary
      description: Requires Idempotency-Key. Steps before idempotency lookup are not replayed. The Review is unchanged. Success is 201 with no commentary field.
      security:
        - bearerAuth: []
      parameters:
        - name: venueID
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        - name: reviewID
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        - name: Idempotency-Key
          in: header
          required: true
          description: 8 to 128 printable ASCII characters. The idempotency operation is review_report.
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewReportRequest"
            example:
              reason: harassment
              note: null
      responses:
        "201":
          description: The pending report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewReportResponse"
        "400":
          description: Validation failed, the caller reported their own Review, or the commentary is not public.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                self:
                  value:
                    error:
                      code: self_report
                      message: You cannot report your own review.
                      request_id: abc
                not_public:
                  value:
                    error:
                      code: commentary_not_public
                      message: This review has no public commentary.
                      request_id: abc
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ContributionForbidden"
        "404":
          description: The Venue or Review was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A pending report already exists, the Venue is pending, or the idempotency key was reused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                pending:
                  value:
                    error:
                      code: review_already_reported
                      message: You already reported this review.
                      request_id: abc
                not_verified:
                  value:
                    error:
                      code: venue_not_verified
                      message: Reviews open after this venue is verified.
                      request_id: abc
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          description: The shared report quota or a write limit refused the request.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                quota:
                  value:
                    error:
                      code: quota_exceeded
                      message: The report limit has been reached.
                      request_id: abc
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/AuthProvider"
  /v1/venues/{venueID}/check-ins:
    parameters:
      - name: venueID
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    post:
      operationId: createCheckIn
      summary: Check in at a venue
      description: Records a visit by the caller to a pending or verified Venue. Requires Idempotency-Key. Steps before idempotency lookup are not replayed.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 8 to 128 printable ASCII characters. The idempotency operation is check_in. A replay returns the stored 201 body.
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInRequest"
            example:
              visited_at: "2026-10-24T20:30:00Z"
      responses:
        "201":
          description: The Check-in was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResponse"
        "400":
          description: The id, body, or idempotency key is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                timestamp:
                  value:
                    error:
                      code: validation_error
                      message: The request is invalid.
                      request_id: abc
                      fields:
                        visited_at: must be a timestamp
                past:
                  value:
                    error:
                      code: validation_error
                      message: The request is invalid.
                      request_id: abc
                      fields:
                        visited_at: must be within the last 24 hours
                future:
                  value:
                    error:
                      code: validation_error
                      message: The request is invalid.
                      request_id: abc
                      fields:
                        visited_at: must not be more than 5 minutes ahead
                key:
                  value:
                    error:
                      code: validation_error
                      message: The request is invalid.
                      request_id: abc
                      fields:
                        idempotency_key: required
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ContributionForbidden"
        "404":
          description: The Venue is not in the public catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: venue_not_found
                  message: Venue not found.
                  request_id: abc
        "409":
