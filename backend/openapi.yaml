          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/AuthProvider"
  /v1/moderation/venues/{venueID}:
    parameters:
      - name: venueID
        in: path
        required: true
        description: Canonical Venue id. Any other value is rejected.
        schema:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    get:
      operationId: getModerationVenue
      summary: Read one venue for moderation
      description: Returns a Venue in any status with its feedback fields, the Submitter's full profile, its pending reports, and its newest 20 audit rows. Every part is read from one consistent snapshot.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The Venue, its Submitter (null when deleted or without a profile), its pending reports, and its moderation history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationVenueResponse"
        "400":
          description: The Venue id is not canonical.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: validation_error
                  message: The request is invalid.
                  request_id: abc
                  fields:
                    venue_id: must be a canonical uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller has no platform operator row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: forbidden
                  message: This action requires a moderator account.
                  request_id: abc
        "404":
          description: No Venue has that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: venue_not_found
                  message: Venue not found.
                  request_id: abc
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/AuthProvider"
    put:
      operationId: correctVenueAsOperator
      summary: Correct a venue as an operator
      description: Replaces every editable field and the Genre set of a pending or verified Venue. It never changes status and does not require Idempotency-Key. A change appends one audit row with equal prior and new status and marks the Venue's pending reports actioned. An unchanged body returns 200, writes nothing, and spends no write token. Duplicate detection excludes this Venue.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionRequest"
      responses:
        "200":
          description: The corrected Venue with its status unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModeratedVenueResponse"
        "400":
          description: The id or body is invalid, or a Genre id does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller has no platform operator row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: forbidden
                  message: This action requires a moderator account.
                  request_id: abc
        "404":
          description: No Venue has that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: venue_not_found
                  message: Venue not found.
                  request_id: abc
        "409":
          description: The Venue is rejected or delisted, or a strong duplicate exists. Duplicate details appear only when the match is verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                transition:
                  value:
                    error:
                      code: invalid_venue_transition
                      message: This action is not available for a venue with that status.
                      request_id: abc
                duplicate:
                  value:
                    error:
                      code: duplicate_venue
                      message: A matching venue already exists.
                      request_id: abc
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/AuthProvider"
  /v1/moderation/venues/{venueID}/actions:
    post:
      operationId: applyVenueAction
      summary: Apply verify, reject, delist, or reopen
      description: verify and reject apply to pending Venues, delist to verified Venues, and reopen to delisted Venues; reopen returns the Venue to verified. reject needs a rejection reason and delist a delisting reason; a note is required when the reason is other. An action on a Venue already in the target state with the same reason and note returns 200 with action_id null, writes nothing, and spends no write token; reopen on a verified Venue that was never delisted is such a no-op. reject on a rejected Venue, or delist on a delisted Venue, with a different reason or note updates the feedback and returns 201 with an audit row whose prior and new status are equal. A change returns 201, appends one audit row, and marks the Venue's pending reports actioned. verify and reopen return 409 venue_incomplete when the Venue has no Genre. reopen does not re-run the strong-duplicate check (known gap). A retry with the same key returns the stored 201.
      security:
        - bearerAuth: []
      parameters:
        - name: venueID
          in: path
          required: true
          description: Canonical Venue id. Any other value is rejected.
          schema:
            type: string
            format: uuid
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        - name: Idempotency-Key
          in: header
          required: true
          description: 8 to 128 printable ASCII characters. The idempotency operation is venue_moderation_action.
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueActionRequest"
            examples:
              verify:
                value:
                  action: verify
              reject:
                value:
                  action: reject
                  reason: insufficient_information
                  note: Add the street number.
              delist:
                value:
                  action: delist
                  reason: permanently_closed
              reopen:
                value:
                  action: reopen
      responses:
        "200":
          description: The Venue was already in the target state with the same reason and note. action_id is null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueActionResponse"
        "201":
          description: The moderation action, or a feedback-only change, was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueActionResponse"
        "400":
          description: The body, Venue id, or idempotency key is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: validation_error
                  message: The request is invalid.
                  request_id: abc
                  fields:
                    action: must be verify, reject, delist, or reopen
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller has no platform operator row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: forbidden
                  message: This action requires a moderator account.
                  request_id: abc
        "404":
          description: No Venue has that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: venue_not_found
                  message: Venue not found.
                  request_id: abc
        "409":
          description: The action is not available from the Venue's status, verify or reopen found no Genre on the Venue, or the idempotency key was already used for a different command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                transition:
                  value:
                    error:
                      code: invalid_venue_transition
                      message: This action is not available for a venue with that status.
                      request_id: abc
                incomplete:
                  value:
                    error:
                      code: venue_incomplete
                      message: This venue needs at least one genre before it can be verified.
                      request_id: abc
                idempotency:
                  value:
                    error:
                      code: idempotency_key_reused
                      message: That idempotency key was already used.
                      request_id: abc
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/AuthProvider"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Genre:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
    GenreListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Genre"
    PublicVenue:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - latitude
        - longitude
        - address
        - city
        - country_code
        - venue_type
        - verification_status
        - genres
        - average_rating
        - review_count
        - check_in_count
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        name:
          type: string
        description:
          type: [string, "null"]
        latitude:
          type: number
        longitude:
          type: number
        address:
          type: string
        city:
          type: string
        country_code:
          type: string
          pattern: "^[A-Z]{2}$"
          description: Official ISO 3166-1 alpha-2 code, plus XK for Kosovo. The United Kingdom is GB.
        venue_type:
          type: string
          enum: [bar, pub, club]
        verification_status:
          type: string
          enum: [pending, verified]
        genres:
          type: array
          items:
            $ref: "#/components/schemas/Genre"
        average_rating:
          type: [number, "null"]
        review_count:
          type: integer
        check_in_count:
          type: integer
        distance_meters:
          type: integer
          minimum: 0
          description: Metres from the supplied point, rounded half up. Present only on GET /v1/venues when latitude, longitude, and radius_km are supplied. Never present on GET /v1/venues/{venueID}.
    VenueResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PublicVenue"
    VenueListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PublicVenue"
        meta:
          type: object
          additionalProperties: false
          required: [next_cursor]
          properties:
            next_cursor:
              type: [string, "null"]
    ReviewRequest:
      type: object
      additionalProperties: false
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: A JSON integer. A fraction, including 4.0, an exponent, a string, or null fails with rating must be between 1 and 5.
        commentary:
          type: [string, "null"]
          maxLength: 2000
          description: Trimmed and NFC-normalized. Line breaks are allowed. Omitted, null, or whitespace-only is stored as null.
    Review:
      type: object
      additionalProperties: false
      required: [id, rating, commentary, commentary_removed, author, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        commentary:
          type: [string, "null"]
        commentary_removed:
          type: boolean
          description: True only when a moderator cleared the commentary and set commentary_removed_at.
        author:
          type: object
          additionalProperties: false
          required: [username, display_name]
          properties:
            username:
              type: [string, "null"]
              description: Null when the author must rename or is suspended.
            display_name:
              type: string
              description: MetalHops User when the author must rename or is suspended.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ReviewListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        meta:
          type: object
          additionalProperties: false
          required: [next_cursor]
          properties:
            next_cursor:
              type: [string, "null"]
    OwnReview:
      type: object
      additionalProperties: false
      description: The Review fields plus user_id, the stored Username, and the User-visible commentary restriction.
      required: [id, user_id, rating, commentary, commentary_removed, commentary_restriction, author, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        commentary:
          type: [string, "null"]
        commentary_removed:
          type: boolean
        commentary_restriction:
          oneOf:
            - $ref: "#/components/schemas/UserCommentaryRestriction"
            - type: "null"
        author:
          type: object
          additionalProperties: false
          required: [username, display_name]
          properties:
            username:
              type: string
            display_name:
              type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserCommentaryRestriction:
      type: object
      additionalProperties: false
      required: [reason, note, created_at]
      properties:
        reason:
          type: string
          enum: [spam, harassment, hate_or_discrimination, personal_information, illegal_content, off_topic, other]
        note:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
          description: When the current uninterrupted restriction began.
    OwnReviewResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/OwnReview"
    ReviewReportRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [spam, harassment, hate_or_discrimination, personal_information, illegal_content, off_topic, other]
        note:
          type: [string, "null"]
          maxLength: 1000
    ReviewReport:
      type: object
      additionalProperties: false
      required: [id, review_id, venue_id, reason, note, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        review_id:
          type: string
          format: uuid
        venue_id:
          type: string
          format: uuid
        reason:
          type: string
        note:
          type: [string, "null"]
        status:
          type: string
          enum: [pending]
        created_at:
          type: string
          format: date-time
    ReviewReportResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ReviewReport"
    ReviewReportItem:
      type: object
      additionalProperties: false
      required: [id, reason, note, status, review_id, venue_id, rating, commentary, commentary_removed, created_at, reporter, author]
      properties:
        id:
          type: string
          format: uuid
        reason:
          type: string
        note:
          type: [string, "null"]
        status:
          type: string
        review_id:
          type: string
          format: uuid
        venue_id:
          type: string
          format: uuid
        rating:
          type: integer
        commentary:
          type: [string, "null"]
        commentary_removed:
          type: boolean
        created_at:
          type: string
          format: date-time
        reporter:
          oneOf:
            - $ref: "#/components/schemas/Profile"
            - type: "null"
        author:
          oneOf:
            - $ref: "#/components/schemas/Profile"
            - type: "null"
    ReviewReportItemResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ReviewReportItem"
    ReviewReportItemListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ReviewReportItem"
        meta:
          type: object
          additionalProperties: false
          required: [next_cursor]
          properties:
            next_cursor:
              type: [string, "null"]
    ReviewModerationAction:
      type: object
      additionalProperties: false
      required: [action, reason]
      properties:
        action:
          type: string
          enum: [remove_commentary, delete_review]
        reason:
          type: string
          enum: [spam, harassment, hate_or_discrimination, personal_information, illegal_content, off_topic, other]
        note:
          type: [string, "null"]
          maxLength: 1000
    OperatorReview:
      type: object
      additionalProperties: false
      required: [id, venue_id, user_id, rating, commentary, commentary_removed, commentary_removed_at, author, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        venue_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        rating:
          type: integer
        commentary:
          type: [string, "null"]
        commentary_removed:
          type: boolean
        commentary_removed_at:
          type: [string, "null"]
          format: date-time
        author:
          oneOf:
            - $ref: "#/components/schemas/Profile"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ReviewAuditEntry:
      type: object
      additionalProperties: false
      description: Append-only audit row. It has no commentary property.
      required: [id, action, reason, note, review_id, reviewer_user_id, venue_id, operator_user_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          enum: [commentary_removed, review_deleted]
        reason:
          type: string
        note:
          type: [string, "null"]
        review_id:
          type: string
          format: uuid
        reviewer_user_id:
          type: [string, "null"]
          format: uuid
        venue_id:
          type: string
          format: uuid
        operator_user_id:
          type: [string, "null"]
          format: uuid
        created_at:
          type: string
          format: date-time
    OperatorCommentaryRestriction:
      type: object
      additionalProperties: false
      required: [created_at, source]
      properties:
        created_at:
          type: string
          format: date-time
        source:
          $ref: "#/components/schemas/ReviewAuditEntry"
    ModerationReview:
      type: object
      additionalProperties: false
      required: [review, reports, history, commentary_restriction]
      properties:
        review:
          $ref: "#/components/schemas/OperatorReview"
        reports:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, reason, note, created_at, reporter]
            properties:
              id:
                type: string
                format: uuid
              reason:
                type: string
              note:
                type: [string, "null"]
              created_at:
                type: string
                format: date-time
              reporter:
                oneOf:
                  - $ref: "#/components/schemas/Profile"
                  - type: "null"
        history:
          type: array
          items:
            $ref: "#/components/schemas/ReviewAuditEntry"
        commentary_restriction:
          oneOf:
            - $ref: "#/components/schemas/OperatorCommentaryRestriction"
            - type: "null"
    ModerationReviewResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ModerationReview"
    ReviewActionResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [action_id, review_id, review]
          properties:
            action_id:
              type: [string, "null"]
              format: uuid
            review_id:
              type: string
              format: uuid
            review:
              oneOf:
                - $ref: "#/components/schemas/OperatorReview"
                - type: "null"
    CheckInRequest:
      type: object
      additionalProperties: false
      properties:
        visited_at:
          type: [string, "null"]
          format: date-time
          description: RFC 3339 timestamp. Omitted or null means now. It must be within the last 24 hours and no more than 5 minutes ahead; a time up to 5 minutes ahead is stored as now.
    CheckIn:
      type: object
      additionalProperties: false
      required: [id, venue_id, visited_at, recorded_at, venue]
      properties:
        id:
          type: string
          format: uuid
        venue_id:
          type: string
          format: uuid
        visited_at:
          type: string
          format: date-time
        recorded_at:
          type: string
          format: date-time
        venue:
          $ref: "#/components/schemas/CheckInVenue"
    CheckInVenue:
      type: object
      additionalProperties: false
      required: [name, city, country_code, verification_status]
      properties:
        name:
          type: string
        city:
          type: string
        country_code:
          type: string
          pattern: "^[A-Z]{2}$"
        venue_type:
          type: string
          enum: [bar, pub, club]
          description: Absent for rejected and delisted Venues.
        verification_status:
          type: string
          enum: [pending, verified, rejected, delisted]
    CheckInResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CheckIn"
    CheckInListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CheckIn"
        meta:
          type: object
          additionalProperties: false
          required: [next_cursor]
          properties:
            next_cursor:
              type: [string, "null"]
    Checker:
      type: object
      additionalProperties: false
      description: Redacted the same way as Review authorship.
      required: [username, display_name]
      properties:
        username:
          type: [string, "null"]
          description: Null when the checker must rename or is suspended.
        display_name:
          type: string
          description: MetalHops User when the checker must rename or is suspended.
    CheckInFeedItem:
      type: object
      additionalProperties: false
      required: [id, visited_at, recorded_at, checker]
      properties:
        id:
          type: string
          format: uuid
        visited_at:
          type: string
          format: date-time
        recorded_at:
          type: string
          format: date-time
        checker:
          $ref: "#/components/schemas/Checker"
    CheckInFeedResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          maxItems: 20
          description: Newest recorded_at first, then id descending.
          items:
            $ref: "#/components/schemas/CheckInFeedItem"
    SubmissionRequest:
      type: object
      additionalProperties: false
      required: [name, latitude, longitude, address, city, country_code, venue_type, genre_ids]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          description: Trimmed and NFC-normalized. A single line.
        description:
          type: [string, "null"]
          minLength: 1
          maxLength: 2000
          description: Trimmed and NFC-normalized. Line breaks are allowed. Omit or send null for none.
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        address:
          type: string
          minLength: 1
          maxLength: 500
          description: Trimmed and NFC-normalized. A single line.
        city:
          type: string
          minLength: 1
          maxLength: 120
          description: Trimmed and NFC-normalized. A single line.
